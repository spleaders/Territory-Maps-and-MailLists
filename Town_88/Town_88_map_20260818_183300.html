<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f0f0; }
#header {
  background: #E53935; color: white;
  padding: 8px 16px; display: flex;
  align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 4px; min-height: 56px; box-sizing: border-box;
}
#header h1 { font-size: 17px; font-weight: bold; margin: 0; line-height: 1.2; }
#header .subtitle { font-size: 10px; opacity: 0.75; margin-top: 1px; }
#header .stats { font-size: 12px; opacity: 0.9; }
#map { height: calc(100vh - 96px); width: 100%; display: block; }
.leaflet-popup-content-wrapper {
  border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.3);
  border-left: 6px solid #E53935;
  padding: 0;
}
.leaflet-popup-content { margin: 0; width: 360px !important; }
.popup-inner { padding: 18px 22px; }
.popup-mapid {
  font-size: 14px; color: #888; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 4px;
}
.popup-site {
  font-size: 20px; font-weight: bold; color: #E53935;
  margin-bottom: 7px; line-height: 1.3;
}
.popup-owner { font-size: 17px; color: #222; margin-bottom: 4px; }
.popup-mail { font-size: 17px; color: #555; margin-bottom: 10px; }
.popup-badge {
  display: inline-block; padding: 5px 12px; border-radius: 10px;
  font-size: 14px; font-weight: bold; color: white; margin-right: 4px;
}
.badge-owner  { background: #E53935; }
.badge-vacant { background: #808080; }
.badge-inst   { background: #548235; }
.badge-biz    { background: #7B2D8B; }
.badge-dnc    { background: #cc0000; }
.badge-research { background: #FFFF00; color: #333; }
.legend-resizer{position:absolute;bottom:4px;right:4px;width:14px;height:14px;cursor:se-resize;opacity:0.4;z-index:10;background:linear-gradient(135deg,transparent 50%,#888 50%,#888 60%,transparent 60%,transparent 70%,#888 70%,#888 80%,transparent 80%);}.legend-resizer:hover{opacity:0.8;}#legend {
  position: absolute; bottom: 24px; right: 10px; z-index: 1000;
  background: white; border-radius: 12px; padding: 16px 22px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.2); font-size: 17px;
  min-width: 224px; cursor: move; user-select: none;
}
#legend h4 {
  font-size: 18px; margin-bottom: 12px; color: #333;
  border-bottom: 2px solid #eee; padding-bottom: 6px;
}
#legend-close {

}
#legend-close:hover { color: #333; }
.legend-row { display: flex; align-items: center; margin-bottom: 10px; }
.legend-swatch {
  width: 20px; height: 20px; border-radius: 4px;
  margin-right: 12px; flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.25);
  display: inline-block !important;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
#notes-bar {
  display: none; position: absolute; top: 58px; left: 10px;
  right: 10px; z-index: 1000;
  background: #FFF8E1; border-left: 4px solid #F5A623;
  border-radius: 6px; padding: 8px 12px;
  font-size: 12px; color: #555; max-width: 500px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
#tab-bar {
  display: flex; background: #E53935;
  padding: 0 12px; height: 40px; box-sizing: border-box;
}
.tab-btn {
  padding: 8px 20px; cursor: pointer; color: rgba(255,255,255,0.7);
  font-size: 13px; font-weight: bold; border: none;
  background: transparent; border-bottom: 3px solid transparent;
}
.tab-btn.active {
  color: white; border-bottom: 3px solid white;
}

#table-view {
  display: none; height: calc(100vh - 90px);
  overflow-x: scroll; overflow-y: auto; padding: 16px; background: #f5f5f5;
  /* 2026-08-14: paired with the scrollLeft=0 reset in showTab() -- stops
     the browser's own scroll-anchoring from nudging this container
     sideways again (e.g. on rotation) once the wide table is built. */
  overflow-anchor: none;
}
#table-view::-webkit-scrollbar {
  height: 12px; width: 12px;
}
#table-view::-webkit-scrollbar-track {
  background: #ddd; border-radius: 6px;
}
#table-view::-webkit-scrollbar-thumb {
  background: #888; border-radius: 6px;
}
#table-view::-webkit-scrollbar-thumb:hover {
  background: #555;
}

#search-box {
  width: 100%; max-width: 400px; padding: 8px 12px;
  border: 1px solid #ccc; border-radius: 6px;
  font-size: 14px; margin-bottom: 12px;
}
#data-table {
  width: 1480px; border-collapse: collapse;
  table-layout: fixed;
  background: white; font-size: 13px;
}
#table-wrapper {
  display: block; overflow-x: auto;
  border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
#data-table th {
  background: #E53935; color: white;
  padding: 10px 12px; text-align: left;
  cursor: pointer; white-space: nowrap;
  user-select: none; position: sticky;
  top: 0; z-index: 10; min-width: 60px;
}
#data-table th:hover { opacity: 0.85; }
#data-table th.sort-asc::after { content: " "; font-size: 10px; }
#data-table th.sort-desc::after { content: " "; font-size: 10px; }
#data-table td {
  padding: 8px 12px; border-bottom: 1px solid #eee;
  vertical-align: top; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  max-width: 0;
}
#data-table td:hover {
  white-space: normal; overflow: visible;
  background: #fffde7; position: relative; z-index: 5;
}
#data-table th {
  position: sticky; top: 0; z-index: 10;
  resize: horizontal; overflow: auto;
  min-width: 40px;
}
#data-table tr:hover td { background: #f0f4ff; }
.badge-res   { background: #E53935; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-biz2  { background: #7B2D8B; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-inst2 { background: #548235; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-vac2  { background: #808080; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-dnc2  { background: #cc0000; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-res2  { background: #E65100; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
#btn-bar {
  /* 2026-08-13: top moved from 56px (bottom of #header only) to 96px
     (bottom of #header + #tab-bar, same 96 used in #map's height calc
     below) -- once this wraps to multiple rows on a narrow phone, 56px
     let it float down over the Map/Mailing List tabs, covering part of
     the Mailing List tab. Starting below the tabs means it only ever
     floats over the map area, no matter how tall it wraps. */
  position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
  z-index: 1000; display: flex; gap: 8px; align-items: center;
  /* 2026-08-13: was a single un-wrapped row -- wider than a phone screen,
     so Share Territory (leftmost) got pushed off-screen with no way to
     scroll a floating/absolute element back into view. Wrapping onto
     multiple centered rows keeps every control reachable on narrow
     screens; no change on desktop, where it already fit on one line. */
  flex-wrap: wrap; justify-content: center; max-width: 94vw;
}
#header #share-btn {
  /* 2026-08-14: moved out of the floating #btn-bar and into the header's
     own flex row so it takes up real layout space instead of floating on
     top of the page -- it can no longer cover the Mailing List table (or
     anything else) underneath it. Print Map was removed at the same time
     (rarely used, and window.print() output wasn't reliable). */
  background: rgba(255,255,255,0.95); border: 1px solid #ccc;
  border-radius: 8px; padding: 5px 12px;
  font-size: 12px; font-weight: bold; color: #333;
  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
#header #share-btn:hover { background: #f0f0f0; }
@media print {
  @page { margin: 0; size: auto; }
  #header, #tab-bar, #btn-bar, #mapid-search,
  #notes-bar, #table-view,
  .leaflet-control-container { display: none !important; }
  html, body { margin: 0 !important; padding: 0 !important;
                overflow: hidden !important; }
  #map { position: fixed !important;
          top: 0 !important; left: 0 !important;
          width: 100vw !important; height: 100vh !important;
          z-index: 1 !important; }
  #legend { z-index: 2 !important;
             max-width: 200px !important;
             right: 10px !important;
             bottom: 10px !important;
             left: auto !important;
             top: auto !important;
             font-size: 13px !important; }
}
#mapid-search {
  background: rgba(255,255,255,0.97); border: 1px solid #ccc;
  border-radius: 8px; padding: 6px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  display: flex; align-items: center; gap: 8px;
}
#mapid-search input {
  border: none; outline: none; font-size: 13px;
  width: 80px; background: transparent;
}
#mapid-search label {
  font-size: 12px; color: #666; white-space: nowrap;
}
#mapid-search-clear {
  cursor: pointer; color: #aaa; font-size: 14px;
  display: none;
}
#mapid-search-clear:hover { color: #333; }
#table-body{
  /* 2026-08-14: the .ml-hdr banner strips (street address / building-type
     bars) are plain divs, not grids -- they can't size themselves to
     match their sibling .ml-row/.ml-col-header's 1135px-wide grid content
     the way width:max-content works on those. Fixing #table-body itself
     to its content's real width instead makes every plain-div child
     (which defaults to filling 100% of ITS parent) stretch to match,
     same fix family as the .ml-row/.ml-col-header width rules below. */
  width: max-content; min-width: 100%;
}
.ml-hdr{padding:10px 16px;font-weight:bold;font-size:13px;color:white;letter-spacing:0.5px;}
/* 2026-08-14: without an explicit width, a grid row/header only sizes
   itself to the *viewport's* width (its containing block), even though
   its grid-template-columns add up to something much wider (the
   Multi-Occupant table's 11 columns run ~1135px). The extra columns still
   render -- that's why scrolling right shows the data -- but the row's
   own background paint stops at its (viewport-width) box edge, so every
   column past that point looks blank/white on a phone. On a desktop
   window wider than 1135px this never showed up, since the row's
   viewport-constrained width already covered the whole table. max-content
   makes the row/header size itself to its actual grid content instead;
   min-width:100% keeps it filling the full width on screens wider than
   the table itself, same as before. */
.ml-col-header{display:grid;width:max-content;min-width:100%;background:#4472C4;color:white;font-size:12px;font-weight:bold;}
/* 2026-08-18: Steve's call -- visible gridlines on both the column header
   and every data row, spreadsheet-style. Header's divider was already
   there but very faint (white-on-blue); data rows had no vertical divider
   at all, just a bottom line on the whole row. */
.ml-col-header span{padding:6px 8px;white-space:nowrap;overflow:hidden;
  border-right:1px solid rgba(255,255,255,0.45);cursor:pointer;user-select:none;}
.ml-col-header span:hover{background:rgba(255,255,255,0.15);}
.ml-row{display:grid;width:max-content;min-width:100%;font-size:12px;border-bottom:1px solid #ccc;}
.ml-row span{padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-right:1px solid #ddd;}
.ml-row span:last-child{border-right:none;}
.ml-row:hover span{white-space:normal;overflow:visible;background:#fffde7;
  position:relative;z-index:5;}
/* 2026-08-17: Occupancy carries a full sentence now, not a short tag --
   wrap it permanently (not just on hover like other columns) so it's
   readable without needing to mouse over every row. */
.ml-wrap{white-space:normal !important;overflow:visible !important;
  text-overflow:clip !important;word-break:break-word;line-height:1.3;}
.check-icon{font-size:16px;cursor:pointer;background:rgba(255,255,255,0.85);
  border-radius:3px;display:flex;align-items:center;justify-content:center;
  line-height:1;border:none!important;box-shadow:none!important;}
.check-icon:hover{background:rgba(255,255,255,1);}
.ml-even-g{background:#E2EFDA;}
.ml-odd{background:#FFFFFF;}
.ml-even-y{background:#FFF2CC;}
.ml-dnc{background:#FFB3B3;}
.ml-gap{height:12px;background:#e8e8e8;}
.ml-none{padding:8px 16px;color:#888;font-size:12px;font-style:italic;}
</style>
</head>
<body>
<!-- 2026-08-17: diagonal-hatch pattern for excluded/DNC parcels & buildings,
     Steve's request to make them stand out beyond just red fill. Referenced
     via fillColor:'url(#dncHatch)' by a small SVG-rendered overlay layer
     added on top of the main canvas-rendered map (the main layer uses
     preferCanvas for performance, and canvas fills can't reference an SVG
     pattern -- so the hatch draws in its own tiny SVG layer instead, just
     for the handful of excluded features, not the whole parcel set). -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="dncHatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#CC0000"></rect>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#660000" stroke-width="4"></line>
    </pattern>
  </defs>
</svg>

  // 2026-07-12: p.site is already the full "street, city state zip" address
  // (built that way in refresh_html_map.py) -- appending ", Fond du Lac, WI"
  // on top of that duplicated the city/state/zip and made Google Maps fail
  // to find the address (confirmed by Steve). Use p.site as-is.
  var mapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(_mapsAddr(p.site));
  var viewUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(_mapsAddr(p.site));
  var mapsHtml = p.site ? '<div style="margin-top:6px"><a href="' + mapsUrl + '" target="_blank" style="font-size:12px;color:#1a73e8;text-decoration:none;">&#x1F4CD; Get Directions</a></div>' : '';

  return '<div class="popup-inner">' +
    '<div class="popup-mapid">Parcel #' + p.mapid + '</div>' +
    '<div class="popup-site">' + p.site + '</div>' +
    '<div class="popup-owner">' + p.owner + '</div>' +
    mailHtml + saluteHtml +
    mapsHtml +
    '<div style="margin-top:6px">' + badge + '</div>' +
    '</div>';
}

function getParcelArea(feature) {
  var coords = feature.geometry.coordinates;
  var allPoints = [];
  function collectPoints(c) {
    if (typeof c[0] === 'number') { allPoints.push(c); }
    else { c.forEach(collectPoints); }
  }
  collectPoints(coords);
  if (allPoints.length < 2) return 0;
  var lats = allPoints.map(function(p) { return p[1]; });
  var lngs = allPoints.map(function(p) { return p[0]; });
  return (Math.max.apply(null,lats)-Math.min.apply(null,lats)) * (Math.max.apply(null,lngs)-Math.min.apply(null,lngs));
}
var DEFAULT_FILL_OPACITY = 0.3;  // 2026-07-14: matches opacity-slider's value="30" -- getOpacity()
                                  // previously always returned 1.0 regardless of the slider default,
                                  // so parcels loaded fully opaque until the slider was touched by hand.
function getOpacity(feature) {
  return DEFAULT_FILL_OPACITY;
}
// Store per-parcel area for label sizing
var parcelAreas = {};
parcelsData.features.forEach(function(f) {
  parcelAreas[f.properties.mapid] = getParcelArea(f);
});

L.geoJSON(parcelsData, {
  style: function(feature) {
    var p = feature.properties;
    return {
      fillColor: p.fill,
      fillOpacity: getOpacity(feature),
      color: 'rgba(0,0,0,0.65)',
      weight: 2.0
    };
  },
  onEachFeature: function(feature, layer) {
    var p = feature.properties;
    _parcelLayers[p.mapid]=layer;
    layer._origStyle={
      fillColor:layer.options.fillColor,
      fillOpacity:layer.options.fillOpacity,
      color:layer.options.color,
      weight:layer.options.weight
    };
    layer.bindPopup(getPopup(p), {maxWidth: 300});
    var area = getParcelArea(feature);
    // Store area on tooltip element for zoom-aware sizing.
    // 2026-07-11: skip the label entirely for placeholder mapids
    // (prefixed "_dissolved" by refresh_html_map.py) -- these mark a
    // parcel that was broken into individual buildings, kept only so the
    // polygon/fill still shows; the placeholder name isn't a real MapID
    // and showing it just confuses the map.
    // 2026-07-14: also skip it for Multi_Occupant parcels (townhouse-style
    // complexes with many individually-addressed units) -- each building
    // footprint inside now gets its own real street-address label, so the
    // parcel's plain container number (e.g. "64") just lands on top of
    // whichever building happens to sit at the parcel's center and looks
    // like doubled/confusing text, same reasoning as the _dissolved case.
    // Only when isApartment is true, though -- that's the only case where
    // buildings actually get their own labels to replace this one; for any
    // other territory type the parcel's own number is still the only label
    // that area would have, so it must stay.
    if (!(p.mapid && String(p.mapid).indexOf('_dissolved') === 0) &&
        !(isApartment && p.sheet === 'Multi_Occupant')) {
      var tt = layer.bindTooltip(String(p.mapid), {
        permanent: true, direction: 'center',
        className: 'mapid-label',
        offset: [0, 0]
      });
      layer.on('tooltipopen', function(e) {
        e.tooltip.getElement().setAttribute('data-area', area);
      });
    }
  }
}).addTo(map);

// 2026-07-12: building footprints used to be permanently solid black.
// Now they default to grey and only turn black once the matching
// mailing-list checkbox is marked done -- _buildingLayers is the
// per-building lookup _updateParcel() (in the table-tracking script
// below) uses to flip the color, same pattern as _parcelLayers.
var _buildingLayers = {};
var BUILDING_DEFAULT_FILL = '#C4C4C4';
var BUILDING_DONE_FILL    = '#000000';

if (buildingsData) {
  L.geoJSON(buildingsData, {
    style: function(feature) {
      var p = feature.properties||{};
      // 2026-08-16: excluded/DNC buildings get the same permanent red as
      // their parcel -- set once here at load, never touched by
      // _updateParcel() since _toggleDone() now skips these mapids entirely.
      if (p.dnc === 'YES') {
        return {fillColor: '#CC0000', fillOpacity: DEFAULT_FILL_OPACITY,
                 color: '#660000', weight: 1.5};
      }
      return {
        fillColor: BUILDING_DEFAULT_FILL,
        fillOpacity: DEFAULT_FILL_OPACITY,
        color: '#000000',
        weight: 1.5,
        // 2026-08-08: was "!p.secondary" alone -- Leaflet lets a per-feature
        // style's interactive key override the geoJSON-level "interactive:
        // isApartment" below, so non-apartment buildings (Town/R/Business)
        // ended up interactive anyway with no popup ever bound to them
        // (onEachFeature is a no-op below when !isApartment). That created
        // an invisible dead zone right over each building's roofline that
        // swallowed clicks meant for the parcel layer underneath -- Steve
        // had to click around the building outline on Town_108 before a
        // popup would open. Gating on isApartment here too makes the
        // buildings layer genuinely click-through for non-apartment
        // territories, matching the no-op onEachFeature's intent. No change
        // for apartment territories -- isApartment && !p.secondary reduces
        // to the same !p.secondary as before when isApartment is true.
        interactive: isApartment && !p.secondary
      };
    },
    interactive: isApartment,
    onEachFeature: isApartment ? function(feature, layer) {
      var p = feature.properties;
      var isSecondary = !!p.secondary;
      var bKey = p.subid ? p.subid : (p.mapid || '');
      // 2026-07-28: a secondary duplicate (a smaller building sharing
      // another building's address, e.g. a garage) never becomes "the
      // responder" for that address's checkbox, and never gets a click
      // popup -- only the largest footprint per address stays
      // interactive. It still gets its own permanent on-map label (added
      // by refresh_html_map.py's buildings-tooltip-label patch, same as
      // every other building), just noticeably smaller -- see that
      // script for the label-sizing logic. Deliberately NOT duplicating
      // any label logic here -- that patch already handles every
      // building's label correctly (including L-shaped/tightly-packed
      // footprint anchoring), so this only controls click/checkbox
      // behavior.
      if (bKey !== '' && !isSecondary) {
        _buildingLayers[bKey] = layer;
        layer._origStyle = {
          fillColor: layer.options.fillColor,
          fillOpacity: layer.options.fillOpacity,
          color: layer.options.color,
          weight: layer.options.weight
        };
      }
      if (p.site && p.site !== '' && !isSecondary) {
        var subLabel = p.subid ? p.subid.toUpperCase() : ('Parcel #' + p.mapid);
        var saluteHtml = p.salute && p.salute !== 'nan' && p.salute !== ''
          ? '<div class="popup-mail" style="color:#888">Salutation: ' + p.salute + '</div>' : '';
        // 2026-07-15: p.note is a short data-provenance flag ("Approximate
        // match" / "From Fond du Lac County GIS") -- shown as its own line,
        // kept OUT of p.site itself so the Get Directions link below still
        // gets a clean, real address.
        var noteHtml = p.note && p.note !== ''
          ? '<div class="popup-mail" style="color:#888;font-style:italic">' + p.note + '</div>' : '';
        var bMapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(_mapsAddr(p.site));
        var bMapsHtml = '<div style="margin-top:6px"><a href="' + bMapsUrl + '" target="_blank" style="font-size:12px;color:#1a73e8;text-decoration:none;">&#x1F4CD; Get Directions</a></div>';
        var html = '<div class="popup-inner">' +
          '<div class="popup-mapid">Building ' + subLabel + '</div>' +
          '<div class="popup-site">' + p.site + '</div>' +
          '<div class="popup-owner">' + (p.owner || '') + '</div>' +
          saluteHtml + noteHtml +
          bMapsHtml +
          '</div>';
        layer.bindPopup(html, {maxWidth: 300});
      }
    } : function(feature, layer) {}
  }).addTo(map);
}

// 2026-08-17: diagonal-hatch overlay for excluded/DNC parcels & buildings,
// drawn in its own small SVG-rendered layer on top of the main map (which
// uses preferCanvas for performance -- canvas fills can't reference the
// dncHatch SVG pattern, but only the handful of dnc-flagged features go
// through this extra layer, so there's no performance concern).
// interactive:false so it never blocks popups/clicks on the real layer underneath.
var _dncParcelFeatures = parcelsData.features.filter(function(f){return f.properties.dnc==='YES';});
if (_dncParcelFeatures.length) {
  L.geoJSON({type:'FeatureCollection', features:_dncParcelFeatures}, {
    renderer: L.svg(),
    interactive: false,
    style: function(){return {fillColor:'url(#dncHatch)', fillOpacity:0.85, stroke:false};}
  }).addTo(map);
}
if (buildingsData) {
  var _dncBuildingFeatures = buildingsData.features.filter(function(f){return (f.properties||{}).dnc==='YES';});
  if (_dncBuildingFeatures.length) {
    L.geoJSON({type:'FeatureCollection', features:_dncBuildingFeatures}, {
      renderer: L.svg(),
      interactive: false,
      style: function(){return {fillColor:'url(#dncHatch)', fillOpacity:0.85, stroke:false};}
    }).addTo(map);
  }
}

if (!boundaryData) {
  map.setView([43.77, -88.43], 14);
}

// Scale MapID labels by zoom level AND parcel area
function updateLabelSizes() {
  var z = map.getZoom();
  // Base size from zoom
  var baseSize;
  if      (z <= 13) baseSize = 11;
  else if (z <= 14) baseSize = 15;
  else if (z <= 15) baseSize = 19;
  else if (z <= 16) baseSize = 24;
  else              baseSize = 30;
  document.querySelectorAll('.mapid-label').forEach(function(el) {
    var area = parseFloat(el.getAttribute('data-area') || 0);
    var scale = 1.0;
    // Shrink labels for small parcels
    if      (area < 0.000003) scale = 0.45;
    else if (area < 0.000008) scale = 0.60;
    else if (area < 0.00002)  scale = 0.75;
    else if (area < 0.00006)  scale = 0.88;
    var finalSize = Math.max(7, Math.round(baseSize * scale));
    // 2026-07-28: a "secondary" duplicate building (e.g. a garage sharing
    // an apartment building's address) gets a noticeably smaller label
    // than the real/primary building at that address, at every zoom
    // level -- computed here (rather than a flat CSS override) so it
    // shrinks and grows proportionally with everything else instead of
    // fighting the zoom-based sizing above.
    if (el.classList.contains('mapid-label-sm')) {
      finalSize = Math.max(6, Math.round(finalSize * 0.55));
    }
    el.style.fontSize = finalSize + 'px';
  });
}
map.on('zoomend', updateLabelSizes);
map.on('load', updateLabelSizes);
setTimeout(updateLabelSizes, 500);
</script>
<style>
.mapid-label {
  background: transparent; border: none; box-shadow: none;
  font-weight: bold; color: white;
  text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.9);
  pointer-events: none; transition: font-size 0.1s;
}
</style>
<script>
var _allRows=[];
// 2026-07-27: sort state used to be one fixed entry per confidence bucket
// (conf/ver/res/dnc). Now that the Mailing List tab groups by street within
// each sheet section (Residential/Multi-Occupant/Institutions), each street
// banner needs its own independent sort state -- clicking "sort by Owner"
// on Viking Dr shouldn't touch Columbia Dr's order. Keyed lazily by
// "<sec>|<STREET>" via _getSortState() below instead of a fixed object.
var _sortState={};
function _getSortState(key){
  if(!_sortState[key]){_sortState[key]={col:-1,asc:true};}
  return _sortState[key];}

function _doneKey(mid){return 'done_'+_TERRITORY+'_'+mid;}
function _isDone(mid){return localStorage.getItem(_doneKey(mid))==='1';}
function _setDone(mid,done){if(done)localStorage.setItem(_doneKey(mid),'1');else localStorage.removeItem(_doneKey(mid));}

function _toggleDone(mid){
  // 2026-08-16: excluded/DNC rows are locked -- clicking the map polygon
  // or the mailing-list checkbox (both funnel through here) does nothing,
  // so the permanent red set at page load can never be accidentally
  // toggled into the normal done/not-done black-or-gray scheme, and these
  // rows never enter Done tracking or Firebase sync.
  var row=tableData.filter(function(p){return String(p.mapid)===String(mid);})[0];
  if(row&&row.dnc==='YES')return;
  var done=!_isDone(mid);
  _setDone(mid,done);
  _updateParcel(mid,done);
  _updateTableRow(mid,done);
  _updateParentBuilding(mid);
  _fbPush(mid,done);}

// 2026-07-28: live cross-device Done-checkbox sync. Whenever this page's
// own Firebase listener sees a change (from this page's own toggle, or
// from anyone else's), it lands here and applies it locally -- it never
// calls _fbPush() itself, so this can't turn into a feedback loop. If
// Firebase never loads (no internet in the field, CDN blocked, etc.)
// this quietly no-ops and every checkbox still works exactly as it
// always has, purely locally via localStorage.
var _fbTerRef=null;
function _fbInit(){
  try{
    if(typeof firebase==='undefined'||!firebase.initializeApp||!FIREBASE_CONFIG)return;
    if(!window._fbApp){window._fbApp=firebase.initializeApp(FIREBASE_CONFIG);}
    _fbTerRef=firebase.database().ref('territories/'+_TERRITORY);
    _fbTerRef.on('value', function(snap){
      var vals=snap.val()||{};
      Object.keys(vals).forEach(function(mid){
        var done=!!vals[mid];
        if(_isDone(mid)!==done){
          _setDone(mid,done);
          _updateParcel(mid,done);
          _updateTableRow(mid,done);
          _updateParentBuilding(mid);}});
    });
  }catch(e){ if(window.console)console.warn('Firebase sync unavailable:',e); }}
function _fbPush(mid,done){
  if(_fbTerRef){
    try{ _fbTerRef.child(String(mid)).set(!!done); }catch(e){}}}
setTimeout(_fbInit,600);

function _updateParcel(mid,done){
  var lyr=_parcelLayers[mid];
  if(lyr){
    if(done){lyr.setStyle({fillColor:'#222222',fillOpacity:0.9,color:'#FFFFFF',weight:4});}
    else{lyr.setStyle(lyr._origStyle||{fillColor:'#AAAAAA',fillOpacity:0.4,color:'rgba(0,0,0,0.65)',weight:2.0});}}
  var bld=_buildingLayers[mid];
  if(bld){
    if(done){bld.setStyle({fillColor:BUILDING_DONE_FILL,fillOpacity:0.9});}
    else{bld.setStyle({fillColor:(bld._origStyle&&bld._origStyle.fillColor)||BUILDING_DEFAULT_FILL});}}}

// 2026-07-28: apartment units each got their own checkbox/MapID (397-1,
// 397-2, ...) so checking one unit wouldn't mark every unit in the
// building done. Side effect: _updateParcel(mid,...) above only ever
// matches _buildingLayers keyed by the building's OWN id ("397"), so no
// individual unit's checkbox ever touched the building footprint's
// black/done fill anymore -- checking every single unit in a building no
// longer turned it black either. This restores that: whenever any row
// with a parent_mapid is toggled, look at all of that same parent's
// sibling rows and turn the building black only once every one of them
// is checked (grey again the moment any one gets unchecked).
function _updateParentBuilding(mid){
  var row=null;
  for(var i=0;i<tableData.length;i++){if(String(tableData[i].mapid)===String(mid)){row=tableData[i];break;}}
  if(!row||!row.parent_mapid||String(row.parent_mapid)===String(mid))return;
  var siblings=tableData.filter(function(p){return String(p.parent_mapid)===String(row.parent_mapid);});
  if(!siblings.length)return;
  var allDone=siblings.every(function(p){return _isDone(p.mapid);});
  _updateParcel(row.parent_mapid,allDone);}

function _updateTableRow(mid,done){
  document.querySelectorAll('.ml-check[data-mid="'+mid+'"]').forEach(function(el){
    el.textContent=done?'☑':'☐';});
  document.querySelectorAll('.ml-row[data-mid="'+mid+'"]').forEach(function(el){
    el.style.opacity=done?'0.45':'';});}

function _applyDoneState(){
  // Clear done state if this is a freshly generated map (build timestamp changed)
  var buildKey='build_'+_TERRITORY;
  var lastBuild=localStorage.getItem(buildKey);
  if(lastBuild!==_BUILD_TS){
    // New pipeline run - clear all done state for this territory
    var toRemove=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf('done_'+_TERRITORY+'_')===0)toRemove.push(k);}
    toRemove.forEach(function(k){localStorage.removeItem(k);});
    localStorage.setItem(buildKey,_BUILD_TS);}
  tableData.forEach(function(p){if(_isDone(p.mapid))_updateParcel(p.mapid,true);});
  // 2026-07-28: also reflect apartment building footprints on load, same
  // rule _updateParentBuilding() applies live -- black only once every
  // unit sharing that parent_mapid is already checked.
  var parentGroups={};
  tableData.forEach(function(p){
    if(p.parent_mapid&&String(p.parent_mapid)!==String(p.mapid)){
      var pk=String(p.parent_mapid);
      if(!parentGroups[pk])parentGroups[pk]=[];
      parentGroups[pk].push(p.mapid);}});
  Object.keys(parentGroups).forEach(function(pk){
    var allDone=parentGroups[pk].every(function(m){return _isDone(m);});
    if(allDone)_updateParcel(pk,true);});
  var m=window.location.hash.match(/done=([0-9,]+)/);
  if(m){m[1].split(',').forEach(function(s){
    var mid=parseInt(s);
    if(!isNaN(mid)){_setDone(mid,true);_updateParcel(mid,true);}});}}
setTimeout(_applyDoneState,400);

// 2026-08-14: was clipboard-copy-then-alert -- Steve's intent for this
// button was always to hand the progress link to someone else the same
// way Share Territory does (open the email app directly), not a silent
// clipboard copy. It also had no .catch() on the clipboard promise, so a
// failed copy (which does happen on phones) showed nothing at all -- no
// error, no fallback, button just appeared to do nothing. mailto: sidesteps
// both problems: no clipboard permission involved, and if nothing happens
// it's because the phone has no mail app configured, same as Share
// Territory already assumes.
function shareProgress(){
  // 2026-08-17: Steve's call -- this now shares the map+mailing list in
  // its current state at ANY time, checked-off or not (previously
  // blocked with an alert if nothing was checked off yet). Also adds a
  // readable "shared as of [now]" timestamp so whoever receives it knows
  // exactly when the link was sent.
  var done=[];
  tableData.forEach(function(p){if(_isDone(p.mapid))done.push(p.mapid);});
  var url=window.location.href.split('#')[0]+(done.length?'#done='+done.join(','):'');
  var now=new Date();
  var stamp=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' at '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  var s=encodeURIComponent(_TERRITORY+' Territory Map & Mailing List');
  var progressLine=done.length
    ? 'Here is my progress on the '+_TERRITORY+' territory -- '+done.length+' address(es) checked off so far:'
    : 'Here is the '+_TERRITORY+' territory map and mailing list:';
  var afterLink=done.length
    ? 'Opening this link will show the current map and mailing list, with the same addresses marked as checked off for you too.'
    : 'Opening this link will show the current map and mailing list.';
  var b=encodeURIComponent('Hello,\n\n'+progressLine+'\n\n'+url+'\n\nShared as of '+stamp+'.\n\n'+afterLink+'\n\nThank you!');
  window.location.href='mailto:?subject='+s+'&body='+b;}

function _sortIndicator(key,idx){
  if(idx===0)return '';
  var s=_getSortState(key);
  if(s.col!==idx)return ' ▸';
  return s.asc?' ▲':' ▼';}

// 2026-07-27: every section (Residential/Multi-Occupant/Institutions) now
// uses the same 7-column layout and is independently sortable per street
// banner (key = "<sec>|<STREET>"), matching the per-street Excel Tables
// added to generate_mailing_list.py's banner sheets this session.
// 2026-07-27: Steve's call -- the Multi-Occupant table should show the
// exact same columns as the Excel Multi_Occupant sheet (MapID, NAME1,
// NAME2, BLDG #, STREET, UNIT, CITY, STATE, ZIP, NOTES) instead of the
// generic Owner 1/Owner 2/Site Address/Source layout Residential and
// Institutions use. secKey==='mo' switches both the header and each row
// to the Excel-matching column set; every other section is unchanged.
function _colHdr(key,secKey){
  var isMO=secKey==='mo';
  // 2026-08-17: added Occupancy to both layouts (matches the Excel
  // mailing list's new column), and added Source to the Multi-Occupant
  // layout, which previously had no Source column at all in the HTML map
  // even though the Excel Multi_Occupant sheet has carried one for a
  // while -- a real gap, closed here in the same pass as Occupancy.
  var cols=isMO
    ? ['','MapID','NAME1','NAME2','BLDG #','STREET','UNIT','CITY','STATE','ZIP','Occupancy','NOTES','SOURCE']
    : ['','MapID','Owner 1','Owner 2','Site Address','Occupancy','Source','Reason/Notes'];
  var grid=isMO
    ? '30px 60px 150px 150px 70px 150px 55px 110px 45px 55px 190px 220px 150px'
    : '30px 60px 170px 170px 250px 190px 130px 200px';
  var h='<div class="ml-col-header" style="grid-template-columns:'+grid+';background:#FFA000;color:#3a2800;">';
  cols.forEach(function(c,i){
    if(i===0){h+='<span></span>';return;}
    h+='<span data-key="'+key+'" data-col="'+i+'" onclick="_sortSection(this.dataset.key,parseInt(this.dataset.col))" title="Sort by '+c+'">'+c+_sortIndicator(key,i)+'</span>';
  });
  h+='</div>';
  return h;}

function _sortSection(key,col){
  if(col===0)return;
  var s=_getSortState(key);
  if(s.col===col){s.asc=!s.asc;}else{s.col=col;s.asc=true;}
  renderTable(_allRows);}

function _sortRows(arr,key,secKey){
  var s=_getSortState(key);
  if(s.col<=0){
    // No column chosen yet -- default to building-number order (numeric
    // first, then alphabetic), same default the Excel banner sheets use
    // within each street group.
    return arr.slice().sort(function(a,b){
      var an=_bnumOf(a.site),bn=_bnumOf(b.site);
      var ai=parseInt(an,10),bi=parseInt(bn,10);
      var aNum=!isNaN(ai)&&String(ai)===an, bNum=!isNaN(bi)&&String(bi)===bn;
      if(aNum&&bNum)return ai-bi;
      if(aNum!==bNum)return aNum?-1:1;
      return an.localeCompare(bn);});}
  var cols=secKey==='mo'
    ? ['','mapid','owner','owner2','bldg','street','unit','site_city','site_state','site_zip','occupancy','notes','source']
    : ['','mapid','owner','owner2','site_full','occupancy','source','notes'];
  var sortKey=cols[s.col]||'mapid';
  return arr.slice().sort(function(a,b){
    var av,bv;
    if(sortKey==='site_full'){
      av=((a.site||'')+(a.site_city||'')+(a.site_state||'')+(a.site_zip||'')).toLowerCase();
      bv=((b.site||'')+(b.site_city||'')+(b.site_state||'')+(b.site_zip||'')).toLowerCase();}
    else if(sortKey==='mapid'){av=parseInt(a.mapid||0);bv=parseInt(b.mapid||0);}
    else if(sortKey==='unit'){
      var au=parseInt(a.unit,10),bu=parseInt(b.unit,10);
      if(!isNaN(au)&&!isNaN(bu)){av=au;bv=bu;}
      else{av=String(a.unit||'').toLowerCase();bv=String(b.unit||'').toLowerCase();}}
    else{av=String(a[sortKey]||'').toLowerCase();bv=String(b[sortKey]||'').toLowerCase();}
    if(av<bv)return s.asc?-1:1;
    if(av>bv)return s.asc?1:-1;
    return 0;});}

// 2026-07-27: clicking a mailing-list row (anywhere except the checkbox,
// which stops its own click from bubbling up here) pans/zooms the map to
// that address's building and switches to the Map tab. New feature Steve
// asked for alongside the street-banner layout.
function _rowClickZoom(mid){
  var target=_buildingLayers[mid]||_parcelLayers[mid];
  if(!target||!target.getBounds)return;
  showTab('map');
  setTimeout(function(){map.fitBounds(target.getBounds(),{maxZoom:18});},150);}

function _row(p,cls,secKey){
  var mid=p.mapid;
  // 2026-08-17: DNC/excluded rows show checked here without ever touching
  // localStorage/_isDone -- keeps them permanently ticked-looking without
  // pulling them into Done tracking or Firebase sync.
  var done=_isDone(mid)||p.dnc==='YES';
  var isMO=secKey==='mo';
  // 2026-08-17: widened both grids to add Occupancy (both layouts) and
  // Source (Multi-Occupant only) -- see the matching note on _colHdr().
  var grid=isMO
    ? '30px 60px 150px 150px 70px 150px 55px 110px 45px 55px 190px 220px 150px'
    : '30px 60px 170px 170px 250px 190px 130px 200px';
  var rowStyle=(done?'opacity:0.45;':'')+'cursor:pointer;';
  var r='<div class="ml-row '+cls+'" data-mid="'+mid+'" onclick="_rowClickZoom(\''+mid+'\')" style="grid-template-columns:'+grid+';'+rowStyle+'">';
  r+='<span class="ml-check" data-mid="'+mid+'" onclick="event.stopPropagation();_toggleDone(\''+mid+'\')" style="cursor:pointer;text-align:center;font-size:15px;user-select:none;">'+(done?'☑':'☐')+'</span>';
  r+='<span>'+mid+'</span>';
  if(isMO){
    r+='<span>'+(p.owner||'')+'</span>';
    r+='<span>'+(p.owner2||'')+'</span>';
    r+='<span>'+(p.bldg||'')+'</span>';
    r+='<span>'+(p.street||'')+'</span>';
    r+='<span>'+(p.unit||'')+'</span>';
    r+='<span>'+(p.site_city||'')+'</span>';
    r+='<span>'+(p.site_state||'')+'</span>';
    r+='<span>'+(p.site_zip||'')+'</span>';
    r+='<span class="ml-wrap">'+(p.occupancy||'')+'</span>';
    r+='<span>'+(p.notes||'')+'</span>';
    r+='<span>'+(p.source||'')+'</span>';
  } else {
    var sf=(p.site||'')+(p.site_city?', '+p.site_city:'')+(p.site_state?' '+p.site_state:'')+(p.site_zip?' '+p.site_zip:'');
    r+='<span>'+(p.owner||'')+'</span>';
    r+='<span>'+(p.owner2||'')+'</span>';
    r+='<span>'+sf+'</span>';
    r+='<span class="ml-wrap">'+(p.occupancy||'')+'</span>';
    r+='<span>'+(p.source||'')+'</span>';
    r+='<span>'+(p.notes||'')+'</span>';
  }
  r+='</div>';
  return r;}

function setParcelOpacity(val){
  document.getElementById('opacity-val').textContent=Math.round(val*100)+'%';
  Object.keys(_parcelLayers).forEach(function(mid){
    var lyr=_parcelLayers[mid];
    if(lyr&&!_isDone(parseInt(mid))){
      lyr.setStyle({fillOpacity:val});}});
  // 2026-07-14: buildings were never wired into the slider at all, so
  // building footprints stayed opaque no matter what the slider showed.
  // 2026-07-24: that fix applied the slider to EVERY building with no
  // done-state guard at all (the parcel loop above always had one) -- so
  // a building already checked off on the mailing list, locked to solid
  // black by _updateParcel(), got its opacity overwritten right back to
  // the slider's value on the very next drag, fading out again as the
  // slider moved left. Buildings use their subid (e.g. "30") as their
  // _isDone key directly -- same string _toggleDone() already stores it
  // under -- no parseInt needed here the way the numeric parcel mids need.
  Object.keys(_buildingLayers).forEach(function(bid){
    var bld=_buildingLayers[bid];
    if(bld&&!_isDone(bid)){
      bld.setStyle({fillOpacity:val});}});}

function buildTable(){_allRows=tableData.slice();renderTable(_allRows);}

function filterTable(){
  var q=document.getElementById('search-box').value.toLowerCase();
  renderTable(_allRows.filter(function(p){
    var sf=(p.site||'')+(p.site_city||'')+(p.site_state||'')+(p.site_zip||'');
    return [p.mapid,p.owner,p.owner2,sf,p.notes,p.source].join(' ').toLowerCase().indexOf(q)>=0;}));}

// 2026-07-24: pull the street name (or the full remainder after a rural
// N/S/E/W route number) off a site-address string, same logic as fill_
// addresses.py/generate_mailing_list.py's split_site_address() use on the
// Python side -- used to group Multi_Occupant rows by street the same way
// the Excel Multi_Occupant sheet's banners do.
function _streetOf(site){
  var s=String(site||'').trim();
  var parts=s.split(/\s+/);
  if(parts.length && /^\d+$/.test(parts[0])){parts.shift();}
  else if(parts.length && /^[NSEWnsew]\d+$/.test(parts[0])){parts.shift();}
  return parts.join(' ');}
function _bnumOf(site){
  var s=String(site||'').trim();
  var parts=s.split(/\s+/);
  if(!parts.length)return '';
  if(/^\d+$/.test(parts[0]))return parts[0];
  if(/^[NSEWnsew]\d+$/.test(parts[0]))return parts[0].toUpperCase();
  return '';}

// 2026-07-27: replaces the old flat Confident/Needs Research/Do Not Call
// buckets. Every section (Residential, Multi-Occupant, Institutions) now
// uses this same banner-per-street layout, matching the Excel mailing
// list's look (navy section title, blue street banner, green stats line,
// amber column header) instead of segregating rows by confidence into
// separate top-level lists. colorByConfidence controls whether individual
// rows are colored green/yellow/red by status (Residential, Institutions --
// these have a real mix of confirmed/unconfirmed/DNC rows, same as their
// Excel sheets) or left with the simple alternating green/white look
// Multi_Occupant already had (its rows are all "current resident or
// Melissa lookup" until proven otherwise, same reasoning the Excel side
// used to skip confidence coloring on that sheet).
function _confidenceClass(p){
  if(p.dnc==='YES')return 'ml-dnc';
  if(p.occupied==='Yes'&&p.confidence==='High'&&p.research!=='Yes')return 'ml-even-g';
  return 'ml-even-y';}

// 2026-07-27: Multi-Occupant street groups can mean two very different
// things -- a street of individually-addressed properties (e.g. Apartment
// 471's Stone Castle Dr, each address its own unit -- Steve's 2026-07-24
// call was ONE banner per street there, not one per address, since one-
// per-address was "too busy and non-functional") vs. a street with a
// handful of REAL apartment buildings that each hold many units (e.g.
// Apartment_412's 397/407/417 Harrison St, matching the Excel Multi_
// Occupant sheet's own one-banner-per-building layout). Both cases group
// by street first; this only decides whether to split that street group
// further. The test: if any exact site address repeats within the street
// (multiple unit rows sharing one building's address), it's the real-
// building case -- split into one banner per site. If every site is
// unique, it's the individually-addressed case -- leave it as the single
// combined street banner, unchanged from before. Residential/Institutions
// are untouched either way.
function _bannersForStreetGroup(secKey,rows){
  if(secKey!=='mo')return [{label:null,rows:rows}];
  var bySite={},order=[];
  rows.forEach(function(p){
    var k=String(p.site||'').toUpperCase();
    if(!(k in bySite)){bySite[k]=[];order.push(k);}
    bySite[k].push(p);});
  var hasRepeat=order.some(function(k){return bySite[k].length>1;});
  if(!hasRepeat)return [{label:null,rows:rows}];
  return order.map(function(k){return {label:bySite[k][0].site,rows:bySite[k]};});}
function _renderBannerSection(secKey,title,rows,colorByConfidence){
  if(!rows.length)return '';
  var groups={},order=[];
  rows.forEach(function(p){
    var key=_streetOf(p.site).toUpperCase();
    if(!(key in groups)){groups[key]=[];order.push(key);}
    groups[key].push(p);});
  order.sort();
  var h='<div class=ml-hdr style="background:#1A3A6B">■ '+title+' ('+rows.length+' total)</div>';
  order.forEach(function(streetKey){
    var banners=_bannersForStreetGroup(secKey,groups[streetKey]);
    banners.forEach(function(b){
    var sortKey=secKey+'|'+streetKey+(b.label?('|'+b.label):'');
    var grp=_sortRows(b.rows,sortKey,secKey);
    var first=grp[0];
    var addrLine=(b.label||_streetOf(first.site))+(first.site_city?', '+first.site_city:'')+(first.site_state?' '+first.site_state:'')+(first.site_zip?' '+first.site_zip:'');
    h+='<div class=ml-hdr style="background:#2E5496;font-size:13px;">'+addrLine+'</div>';
    var btype=first.btype||'';
    h+='<div class=ml-hdr style="background:#1B5E20;font-size:11px;font-weight:normal;">'+grp.length+' address(es) on file'+(btype?' &nbsp;|&nbsp; Type: '+btype:'')+'</div>';
    h+=_colHdr(sortKey,secKey);
    grp.forEach(function(p,i){
      var cls=colorByConfidence?_confidenceClass(p):(i%2===0?'ml-even-g':'ml-odd');
      h+=_row(p,cls,secKey);});});});
  return h;}

function renderTable(rows){
  var res=[],mo=[],inst=[];
  rows.forEach(function(p){
    if(p.sheet==='Multi_Occupant'){mo.push(p);}
    else if(p.sheet==='Institutions'){inst.push(p);}
    else{res.push(p);}});
  var sections=[
    _renderBannerSection('res','RESIDENTIAL',res,true),
    _renderBannerSection('mo','MULTI-OCCUPANT ADDRESSES',mo,false),
    _renderBannerSection('inst','INSTITUTIONS',inst,true)
  ].filter(function(s){return s;});
  var h=sections.length?sections.join('<div class=ml-gap></div>'):'<div class=ml-none>No addresses found for this territory.</div>';
  document.getElementById('table-body').innerHTML=h;}

function showTab(tab){
  document.getElementById('map').style.display=tab==='map'?'block':'none';
  document.getElementById('table-view').style.display=tab==='table'?'block':'none';
  /* 2026-08-14: #btn-bar (MapID search + Fill slider) only applies to the
     map -- hide it on the Mailing List tab instead of leaving it floating
     over the table underneath. */
  document.getElementById('btn-bar').style.display=tab==='map'?'flex':'none';
  if(tab==='map'){setTimeout(function(){map.invalidateSize();},100);}
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    b.classList.toggle('active',(tab==='map'&&i===0)||(tab==='table'&&i===1));});
  if(tab==='table'&&!window._tableBuilt){buildTable();window._tableBuilt=true;}
  /* 2026-08-14: on some phones, inserting the (much wider than the screen)
     Multi-Occupant table into #table-view for the first time leaves the
     container scrolled a couple hundred px to the right instead of at its
     left edge -- MapID/Name columns and the left half of every banner get
     scrolled out of view. Nothing in this file ever sets scrollLeft, so
     it looks like the browser doing this on its own while laying out the
     new wide content; forcing it back to 0 right after the table is built
     fixes it regardless of the cause. */
  var tv=document.getElementById('table-view');
  if(tv)tv.scrollLeft=0;}
